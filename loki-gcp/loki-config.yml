auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # Cloud Run gère mal le gRPC persistant sans HTTP/2 de bout en bout,
  # on s'assure que le serveur n'impose pas de contraintes réseau locales.
  http_listen_address: 0.0.0.0
  grpc_listen_address: 0.0.0.0

common:
  instance_addr: 0.0.0.0
  path_prefix: /loki
  storage:
    gcs:
      bucket_name: simplon-floralex-loki-storage
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: gcs
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /tmp/loki/compactor