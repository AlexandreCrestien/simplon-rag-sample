apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_URL}
    isDefault: true
    editable: true
    jsonData:
      timeInterval: '15s'

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: ${LOKI_URL}
    editable: false
    jsonData:
      derivedFields:
        - datasourceUid: loki
          matcherRegex: '"request_id":\s*"([^"]+)"'
          name: request_id
          url: ''