# Promtail lit les logs des conteneurs Docker et les envoie à Loki.
# Il cible uniquement le conteneur simplon_rag_api pour ne pas noyer
# Loki avec les logs de tous les services.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # Fichier qui mémorise la position de lecture dans chaque log
  # (évite de renvoyer les mêmes logs au redémarrage)
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          # On ne collecte que les logs du conteneur API
          - name: name
            values: ['simplon_rag_api']

    relabel_configs:
      # On garde le nom du conteneur comme label pour filtrer dans Grafana
      - source_labels: ['__meta_docker_container_name']
        target_label: container
      # On ajoute un label "job" fixe pour identifier la source
      - target_label: job
        replacement: simplon-rag
