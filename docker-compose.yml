# Base compose: development setup with hot reload and source bind mounts.
# Override for production with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: simplon_rag_postgres_pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/data/db/init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./api
      target: dev
    container_name: simplon_rag_api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --no-access-log
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./api/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      APP_ENV: development
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:4173,http://localhost:8501"
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - api_data_docs:/app/data/docs
      - api_data_eval:/app/data/evaluation
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: simplon_rag_frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      RAG_API_URL: "http://api:8000"
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    restart: unless-stopped

  # --- PROMETHEUS ---
  # Scrape les métriques exposées par l'API sur /metrics/ toutes les 15s.
  # La règle d'alerte latence p95 et taux d'erreur 5xx est définie dans prometheus.yml.
  prometheus:
    image: prom/prometheus:latest
    container_name: simplon_rag_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  # --- LOKI ---
  # Agrégateur de logs compatible Grafana.
  # L'API envoie ses logs JSON via Promtail → Loki.
  # Loki permet de corréler logs ↔ métriques dans Grafana via le champ request_id.
  loki:
    image: grafana/loki:3.0.0
    container_name: simplon_rag_loki
    ports:
      - "3100:3100"
    volumes:
      # Fichier de config Loki minimal (stockage local filesystem)
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # --- PROMTAIL ---
  # Agent qui lit les logs Docker de l'API et les envoie à Loki.
  # Il ajoute un label "container" pour qu'on puisse filtrer par service dans Grafana.
  promtail:
    image: grafana/promtail:3.0.0
    container_name: simplon_rag_promtail
    volumes:
      # Accès aux logs Docker de la machine hôte
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./loki/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  # --- ALERTMANAGER ---
  # Reçoit les alertes de Prometheus et les route vers Discord via webhook.
  # Canal #alerts-prod  → alertes critiques (p95 latence, 5xx)
  # Canal #alerts-info  → alertes informatives (à ajouter selon besoin)
  alertmanager:
    image: prom/alertmanager:latest
    container_name: simplon_rag_alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    restart: unless-stopped

  # --- GRAFANA ---
  # Dashboard de visualisation. Branché sur Prometheus (métriques) et Loki (logs).
  # Datasources et dashboard provisionnés automatiquement au démarrage
  # via les fichiers dans grafana/provisioning/ — pas besoin de tout reconfigurer
  # à chaque restart.
  grafana:
    image: grafana/grafana:latest
    container_name: simplon_rag_grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "3000:3000"
    environment:
      # Désactive l'écran de login pour le dev local (à changer en prod)
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      # Provisioning automatique : datasources + dashboard au démarrage
      - ./grafana/provisioning:/etc/grafana/provisioning
      # Le fichier JSON du dashboard est monté directement
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  pgdata:
  api_data_docs:
  api_data_eval:
  loki_data:
  grafana_data:
